<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>
    <radialGradient id="bg" cx="0.8" cy="0.1" r="1.1">
      <stop offset="0" stop-color="#08331a"/>
      <stop offset="0.6" stop-color="#010d05"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#00ff41" stroke-opacity="0.05"/>
    </pattern>
    <filter id="glow" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="c1">
      <rect x="60" y="112" width="0" height="72">
        <animate attributeName="width" from="0" to="900" dur="1.3s" begin="0.8s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="c2">
      <rect x="60" y="192" width="0" height="34">
        <animate attributeName="width" from="0" to="900" dur="1.3s" begin="2.2s" fill="freeze"/>
      </rect>
    </clipPath>
    <style>
      .m{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
      .r{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;font-size:16px;fill:#00ff41;opacity:0.2;writing-mode:vertical-rl;text-orientation:upright;letter-spacing:3px;animation:fall 8s linear infinite}
      .fi{opacity:0;animation:in .5s forwards}
      .d1{animation-delay:.3s}
      .d2{animation-delay:3.4s}
      .d3{animation-delay:3.8s}
      .cur{animation:blink 1s steps(2) infinite}
      .scan{animation:scan 5s linear infinite}
      .gl1{fill:#ff2d55;opacity:0;animation:g1 5s infinite}
      .gl2{fill:#00e5ff;opacity:0;animation:g2 5s infinite}
      .pulse{animation:pulse 1.6s ease-in-out infinite}
      @keyframes in{to{opacity:1}}
      @keyframes blink{50%{opacity:0}}
      @keyframes fall{from{transform:translateY(-320px)}to{transform:translateY(380px)}}
      @keyframes scan{from{transform:translateY(-20px)}to{transform:translateY(360px)}}
      @keyframes pulse{50%{opacity:0.25}}
      @keyframes g1{0%,91%,100%{opacity:0;transform:translate(0,0)}92%{opacity:.7;transform:translate(4px,0)}94%{opacity:.7;transform:translate(-3px,1px)}96%{opacity:0}}
      @keyframes g2{0%,91%,100%{opacity:0;transform:translate(0,0)}93%{opacity:.7;transform:translate(-4px,0)}95%{opacity:.7;transform:translate(3px,-1px)}97%{opacity:0}}
    </style>
  </defs>
  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <text class="r" x="640" y="0" style="animation-duration:9s;animation-delay:-2s">10110100101101</text>
  <text class="r" x="720" y="0" style="animation-duration:7s;animation-delay:-5s">01001011010010</text>
  <text class="r" x="800" y="0" style="animation-duration:10s;animation-delay:-1s">11010010110100</text>
  <text class="r" x="880" y="0" style="animation-duration:8s;animation-delay:-6s">00101101001011</text>
  <text class="r" x="960" y="0" style="animation-duration:11s;animation-delay:-3s">10010110100101</text>
  <text class="r" x="1040" y="0" style="animation-duration:7.5s;animation-delay:-4s">01101001011010</text>
  <text class="r" x="1120" y="0" style="animation-duration:9.5s;animation-delay:-7s">10100101101001</text>
  <text class="r" x="20" y="0" style="animation-duration:10s;animation-delay:-4s">01011010010110</text>
  <rect x="30" y="30" width="1140" height="280" rx="10" fill="#000000" fill-opacity="0.72" stroke="#00ff41" stroke-opacity="0.55"/>
  <rect x="30" y="30" width="1140" height="34" rx="10" fill="#00ff41" fill-opacity="0.08"/>
  <circle cx="54" cy="47" r="6" fill="#ff5f56"/>
  <circle cx="76" cy="47" r="6" fill="#ffbd2e"/>
  <circle cx="98" cy="47" r="6" fill="#27c93f"/>
  <text class="m" x="600" y="52" font-size="14" fill="#00aa2b" text-anchor="middle">guilherme@fiap: ~/dev</text>
  <rect class="scan" x="30" y="30" width="1140" height="14" fill="#00ff41" opacity="0.05"/>
  <text class="m fi d1" x="60" y="100" font-size="18" fill="#00aa2b">$ whoami</text>
  <text class="m" x="1140" y="100" font-size="16" fill="#00ff41" text-anchor="end"><tspan class="pulse">●</tspan> online</text>
  <g clip-path="url(#c1)">
    <text class="m gl1" x="60" y="170" font-size="64" font-weight="700">GUILHERME NOVAES</text>
    <text class="m gl2" x="60" y="170" font-size="64" font-weight="700">GUILHERME NOVAES</text>
    <text class="m" x="60" y="170" font-size="64" font-weight="700" fill="#00ff41" filter="url(#glow)">GUILHERME NOVAES</text>
  </g>
  <g clip-path="url(#c2)">
    <text class="m" x="60" y="216" font-size="24" fill="#00ff41">Desenvolvedor FullStack <tspan fill="#00aa2b">|</tspan> <tspan fill="#8dffa9">Estudante de ADS na FIAP</tspan></text>
  </g>
  <text class="m fi d2" x="60" y="256" font-size="18" fill="#00aa2b">[ Java ]  [ Python ]  [ React ]  [ TypeScript ]  [ Oracle ]</text>
  <text class="m fi d3" x="60" y="292" font-size="18" fill="#00aa2b">guilherme@fiap:~$ <tspan class="cur" fill="#00ff41">█</tspan></text>
</svg>
