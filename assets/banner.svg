<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <radialGradient id="bg" cx="0.85" cy="0.1" r="1.2">
      <stop offset="0" stop-color="#08331a"/>
      <stop offset="0.6" stop-color="#010d05"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#00ff41" stroke-opacity="0.06"/>
    </pattern>
    <style>
      .m{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,'Courier New',monospace}
      .rot{opacity:0;animation:rot 12s infinite}
      .r1{animation-delay:0s}
      .r2{animation-delay:3s}
      .r3{animation-delay:6s}
      .r4{animation-delay:9s}
      .scan{animation:scan 5s linear infinite}
      .pulse{animation:pulse 1.6s ease-in-out infinite}
      .name{opacity:0;animation:in .8s .2s forwards}
      @keyframes rot{0%{opacity:0;transform:translateY(8px)}4%{opacity:1;transform:translateY(0)}22%{opacity:1;transform:translateY(0)}26%{opacity:0;transform:translateY(-8px)}100%{opacity:0}}
      @keyframes in{to{opacity:1}}
      @keyframes scan{from{transform:translateY(-20px)}to{transform:translateY(320px)}}
      @keyframes pulse{50%{opacity:0.2}}
    </style>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect class="scan" width="1200" height="18" fill="#00ff41" opacity="0.06"/>
  <rect x="0.5" y="0.5" width="1199" height="299" fill="none" stroke="#00ff41" stroke-opacity="0.5"/>
  <rect x="1" y="1" width="1198" height="38" fill="#00ff41" fill-opacity="0.07"/>
  <circle cx="26" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="70" cy="20" r="6" fill="#27c93f"/>
  <text class="m" x="600" y="25" font-size="14" fill="#00aa2b" text-anchor="middle">guilherme@fiap: ~/dev</text>
  <text class="m pulse" x="1170" y="25" font-size="14" fill="#00ff41" text-anchor="end">● online</text>
  <g class="name">
    <text class="m" x="60" y="150" font-size="62" font-weight="700" fill="none" stroke="#00ff41" stroke-width="8" stroke-opacity="0.14" stroke-linejoin="round">Guilherme Novaes</text>
    <text class="m" x="60" y="150" font-size="62" font-weight="700" fill="#00ff41">Guilherme Novaes</text>
  </g>
  <rect x="60" y="172" width="280" height="3" fill="#00ff41" opacity="0.6"/>
  <g class="rot r1">
    <text class="m" x="60" y="232" font-size="28" fill="#8dffa9"><tspan fill="#00aa2b">&gt; </tspan>Desenvolvedor FullStack</text>
  </g>
  <g class="rot r2">
    <text class="m" x="60" y="232" font-size="28" fill="#8dffa9"><tspan fill="#00aa2b">&gt; </tspan>Estudante de ADS na FIAP</text>
  </g>
  <g class="rot r3">
    <text class="m" x="60" y="232" font-size="28" fill="#8dffa9"><tspan fill="#00aa2b">&gt; </tspan>Java | Python | React | Oracle</text>
  </g>
  <g class="rot r4">
    <text class="m" x="60" y="232" font-size="28" fill="#8dffa9"><tspan fill="#00aa2b">&gt; </tspan>Transformando problemas em código</text>
  </g>
</svg>
