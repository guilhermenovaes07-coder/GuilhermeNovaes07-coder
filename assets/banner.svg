<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#021a07"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#00ff41" stroke-opacity="0.07"/>
    </pattern>
    <style>
      .m{font-family:'Fira Code','Courier New',monospace}
      .l{opacity:0;animation:in .4s forwards}
      .a{animation-delay:.3s}
      .b{animation-delay:1.1s}
      .c{animation-delay:1.9s}
      .d{animation-delay:2.7s}
      .cur{animation:blink 1s steps(2) infinite}
      .scan{animation:scan 4s linear infinite}
      @keyframes in{to{opacity:1}}
      @keyframes blink{50%{opacity:0}}
      @keyframes scan{from{transform:translateY(-20px)}to{transform:translateY(320px)}}
    </style>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect class="scan" width="1200" height="20" fill="#00ff41" opacity="0.06"/>
  <rect x="0.5" y="0.5" width="1199" height="299" fill="none" stroke="#00ff41" stroke-opacity="0.5"/>
  <circle cx="30" cy="28" r="6" fill="#ff5f56"/>
  <circle cx="52" cy="28" r="6" fill="#ffbd2e"/>
  <circle cx="74" cy="28" r="6" fill="#27c93f"/>
  <text class="m l a" x="40" y="100" font-size="22" fill="#00aa2b">root@fiap:~# whoami</text>
  <text class="m l b" x="40" y="168" font-size="56" font-weight="700" fill="#00ff41">Guilherme Novaes</text>
  <text class="m l c" x="40" y="212" font-size="22" fill="#00ff41">Desenvolvedor FullStack · Estudante de ADS na FIAP</text>
  <text class="m l d" x="40" y="258" font-size="22" fill="#00aa2b">root@fiap:~#</text>
  <rect class="cur" x="196" y="240" width="12" height="22" fill="#00ff41"/>
</svg>
