<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="1200" height="180">
  <style>
    .c{fill:#000000;stroke:#00ff41;stroke-opacity:0.7;stroke-width:1.5}
    .t{font-family:'Fira Code','Courier New',monospace;font-size:18px;fill:#00ff41;text-anchor:middle;dominant-baseline:middle}
    .g{animation:glow 3s ease-in-out infinite}
    @keyframes glow{50%{stroke-opacity:1}}
  </style>
  <rect width="1200" height="180" fill="#000000"/>
  <g class="g">
    <rect class="c" x="40" y="30" width="170" height="44" rx="8"/>
    <rect class="c" x="230" y="30" width="170" height="44" rx="8"/>
    <rect class="c" x="420" y="30" width="170" height="44" rx="8"/>
    <rect class="c" x="610" y="30" width="170" height="44" rx="8"/>
    <rect class="c" x="800" y="30" width="170" height="44" rx="8"/>
    <rect class="c" x="990" y="30" width="170" height="44" rx="8"/>
    <rect class="c" x="40" y="100" width="170" height="44" rx="8"/>
    <rect class="c" x="230" y="100" width="170" height="44" rx="8"/>
    <rect class="c" x="420" y="100" width="170" height="44" rx="8"/>
    <rect class="c" x="610" y="100" width="170" height="44" rx="8"/>
    <rect class="c" x="800" y="100" width="170" height="44" rx="8"/>
    <rect class="c" x="990" y="100" width="170" height="44" rx="8"/>
  </g>
  <text class="t" x="125" y="52">HTML</text>
  <text class="t" x="315" y="52">CSS</text>
  <text class="t" x="505" y="52">JavaScript</text>
  <text class="t" x="695" y="52">TypeScript</text>
  <text class="t" x="885" y="52">React</text>
  <text class="t" x="1075" y="52">Java</text>
  <text class="t" x="125" y="122">Python</text>
  <text class="t" x="315" y="122">Spring Boot</text>
  <text class="t" x="505" y="122">SQL</text>
  <text class="t" x="695" y="122">Oracle</text>
  <text class="t" x="885" y="122">Git</text>
  <text class="t" x="1075" y="122">GitHub</text>
</svg>
